<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Inner subtle grid lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.1"/>

  <!-- Deming cycle / Process flow arrows & nodes -->
  <g filter="url(#shadow)">
    <!-- Central Process Hub -->
    <rect x="186" y="186" width="140" height="140" rx="36" fill="#ffffff" />
    <path d="M226 236 L286 236 M226 256 L276 256 M226 276 L266 276" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Orbiting PDCA Nodes -->
    <!-- Plan (Top) -->
    <circle cx="256" cy="96" r="32" fill="#ffffff"/>
    <text x="256" y="104" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#047857" text-anchor="middle">P</text>
    
    <!-- Do / Hacer (Right) -->
    <circle cx="416" cy="256" r="32" fill="#ffffff"/>
    <text x="416" y="264" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#047857" text-anchor="middle">H</text>
    
    <!-- Check / Verificar (Bottom) -->
    <circle cx="256" cy="416" r="32" fill="#ffffff"/>
    <text x="256" y="424" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#047857" text-anchor="middle">V</text>
    
    <!-- Act / Actuar (Left) - Accent Orange -->
    <circle cx="96" cy="256" r="32" fill="url(#accent)"/>
    <text x="96" y="264" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">A</text>
    
    <!-- Connecting Curved Arrows -->
    <path d="M 288 96 A 160 160 0 0 1 416 224" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 18"/>
    <path d="M 416 288 A 160 160 0 0 1 288 416" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 18"/>
    <path d="M 224 416 A 160 160 0 0 1 96 288" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 18"/>
    <path d="M 96 224 A 160 160 0 0 1 224 96" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 18"/>
  </g>

  <!-- ISO Badge -->
  <g transform="translate(320, 320)">
    <rect width="84" height="34" rx="17" fill="url(#accent)"/>
    <text x="42" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">ISO</text>
  </g>
</svg>
